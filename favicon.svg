<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- the brand mark: intent violet into proof mint, the product thesis.
       The only place these two values are repeated outside styles/tokens.css,
       because an SVG asset cannot read a custom property. -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4EFF"/>
      <stop offset="1" stop-color="#4ED6A8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="10" fill="url(#m)"/>
</svg>
