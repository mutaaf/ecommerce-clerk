version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["playwright", "@axe-core/*", "lighthouse", "chrome-launcher"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
